# 系统级配置（与具体小说内容无关）：LLM、调试、DevAgent 等。
# 与「小说运行时」入口分离（可选 example_runtime.yaml，缺失时用内置默认）；加载时先读本文件，再合并运行时入口，
# 后者同名键会覆盖前者（便于单项目覆盖）。
#
# 可不提交敏感信息：可复制本文件为 system_config.local.yaml 并在 .gitignore 忽略（若后续实现 local 覆盖）。

# 调试：打开后对应阶段打 DEBUG（控制台与日志文件）
debug:
  startup: true       # 启动阶段加载配置、编排器创建等
  design_phase: true  # 设定讨论流程（会话、主菜单、归纳、保存等）

# Agent 框架与 LLM（见 docs/LLM_AND_AGENT_DESIGN.md）
framework:
  orchestrator: langgraph   # 当前实现为 custom；可选 langgraph | autogen | crewai | custom
  llm: openai_compatible     # 当前用 OpenAI 兼容端点（火山方舟 deepseek-v4-pro）；未配置密钥时回退 dummy；通义千问用 tongyi
  llm_options:
    api_key_env: "DASHSCOPE_API_KEY"
    model: "deepseek-v4-pro"
    base_url: "https://ark.cn-beijing.volces.com/api/coding/v3"
    timeout: 180            # 单次请求超时（秒）；长上下文讨论可再调高或改 framework.llm_options
    max_retries: 1          # 网络/超时重试次数（不含首轮）
  # 通义：llm 改为 tongyi，环境变量 DASHSCOPE_API_KEY（base_url 用 dashscope.aliyuncs.com/compatible-mode/v1）
  # 其他：openai | wenxin

# 开发程序 Agent（自我迭代、跑测试、cursor_tasks，见 TECH_IMPLEMENTATION §3.6）

dev_agent:
  enabled: true
  trigger: on_demand       # continuous | on_demand | off
  test_command: "pytest tests/ -v"
  scope: ["src/", "tests/"]
  search_ideas_enabled: false
