<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Novel-Data 工作台（G4）</title>
<style>
  /* ── Material Design 3 主题 ─────────────────────────────
     保留底层变量名 --acc/--line/--ink/--mut/--card/--bg（JS 模板用 var() 引用），
     仅改其取值到 Material 调色板，故全部 JS/内联样式零改动即随主题切换。 */
  :root {
    --md-pri:#4450a8; --md-on-pri:#fff;
    --md-pri-container:#e1e4fb; --md-on-pri-container:#2c3f9b;
    --md-sec-container:#e9ebf5; --md-on-sec-container:#3d4560;
    --md-surf:#ffffff; --md-surf-1:#f6f7fc; --md-surf-2:#eceffa;
    --md-bg:#f2f4fb; --md-outline:#dbe0f0; --md-outline-2:#e7eaf6;
    --md-on-surf:#1b2233; --md-on-surf-var:#58617a;
    /* 遗留变量名 → Material 值（JS `var(--…)` 与内联样式引用继续有效） */
    --acc:var(--md-pri); --line:var(--md-outline);
    --ink:var(--md-on-surf); --mut:var(--md-on-surf-var);
    --card:var(--md-surf); --bg:var(--md-bg);
    --elev-1:0 1px 2px rgba(20,28,52,.05), 0 2px 8px rgba(20,28,52,.06);
    --elev-2:0 2px 5px rgba(20,28,52,.08), 0 8px 22px rgba(20,28,52,.10);
    --elev-3:0 6px 10px rgba(20,28,52,.10), 0 16px 36px rgba(20,28,52,.14);
  }
  * { box-sizing:border-box; }
  ::selection { background:rgba(68,80,168,.18); }
  body { margin:0; -webkit-font-smoothing:antialiased;
         font-family:Roboto,"Segoe UI",system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
         color:var(--ink); line-height:1.55;
         background:radial-gradient(1100px 460px at 15% -12%, rgba(68,80,168,.08), transparent 62%), var(--bg); }
  /* 顶部应用栏（Top App Bar） */
  header { display:flex; align-items:center; gap:18px; height:62px; padding:0 24px;
           background:var(--md-surf); color:var(--ink); box-shadow:var(--elev-1);
           position:sticky; top:0; z-index:9; }
  header h1 { font-size:19px; margin:0; font-weight:600; letter-spacing:.2px; }
  header select { height:40px; padding:0 14px; border:1px solid var(--md-outline); border-radius:10px;
                  font:inherit; font-size:14px; background:var(--md-surf-1); color:var(--ink); outline:none;
                  transition:border-color .15s, box-shadow .15s; }
  header select:focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(68,80,168,.16); }
  main { max-width:1280px; margin:0 auto; padding:24px; }
  /* 卡片：outlined / elevation 分层，避免嵌套双重阴影 */
  #cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(255px,1fr)); gap:16px; }
  .card { background:var(--md-surf); border:1px solid var(--md-outline-2); border-radius:14px;
          padding:18px 20px; cursor:pointer; transition:box-shadow .18s, transform .18s, border-color .18s; }
  .card:hover { box-shadow:var(--elev-2); transform:translateY(-2px); border-color:var(--acc); }
  .card h3 { margin:0 0 4px; font-size:16px; font-weight:600; }
  .card .slug { color:var(--mut); font-size:12px; margin-bottom:12px; }
  .row { display:flex; justify-content:space-between; font-size:13px; padding:3px 0; }
  .row + .row { border-top:1px solid var(--md-outline-2); margin-top:2px; }
  .row span:last-child { font-weight:500; }
  /* 内容面板：Material Card（elevation 1） */
  section { background:var(--md-surf); border-radius:16px; margin:20px 0; padding:20px 24px;
            box-shadow:var(--elev-1); }
  section h2 { margin:0 0 14px; font-size:13px; font-weight:700; letter-spacing:.6px;
               text-transform:uppercase; color:var(--md-on-surf-var); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(225px,1fr)); gap:14px; }
  .mini { background:var(--md-surf-1); border:1px solid var(--md-outline-2); border-radius:12px;
          padding:14px 16px; font-size:13px; transition:opacity .15s, border-color .15s, box-shadow .18s; }
  .mini h4 { margin:0 0 8px; font-size:13px; font-weight:600; }
  .mini.focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(68,80,168,.16), var(--elev-1); }
  .mini.dim { opacity:.38; }
  .clickable { cursor:pointer; user-select:none; }
  .clickable:hover { color:var(--acc); }
  pre { background:#0f1830; color:#cfe2ff; padding:12px; border-radius:12px; overflow:auto; font-size:12px;
        box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), var(--elev-1); }
  code { background:var(--md-surf-2); border:1px solid var(--md-outline-2); border-radius:6px;
         padding:1px 6px; font-size:12px; font-family:ui-monospace,Menlo,Consolas,monospace; }
  /* 按钮：Material Filled-Tonal */
  button { border:none; background:var(--md-sec-container); color:var(--md-on-sec-container);
           border-radius:10px; padding:8px 18px; cursor:pointer; font:inherit; font-size:13px;
           font-weight:600; letter-spacing:.3px; transition:box-shadow .15s, filter .15s, background .15s; }
  button:hover { box-shadow:var(--elev-1); filter:brightness(.97); }
  button:active { box-shadow:none; }
  button:focus-visible { outline:2px solid var(--acc); outline-offset:2px; }
  /* 输入框：Material Outlined Field */
  input,textarea { border:1px solid var(--md-outline); border-radius:10px; padding:9px 12px; font:inherit;
                   font-size:13px; background:var(--md-surf); color:var(--ink); outline:none;
                   transition:border-color .15s, box-shadow .15s; }
  input:focus,textarea:focus { border-color:var(--acc); box-shadow:0 0 0 3px rgba(68,80,168,.14); }
  /* Chips */
  .pill { display:inline-block; border:1px solid var(--md-outline); background:var(--md-surf);
          border-radius:999px; padding:4px 12px; font-size:12px; margin:2px; cursor:pointer;
          user-select:none; transition:background .12s, box-shadow .12s; }
  .pill:hover { background:var(--md-sec-container); }
  .pill.on { background:var(--acc); border-color:var(--acc); color:#fff; box-shadow:var(--elev-1); }
  .pill.warn { border-color:#e0835f; color:#a4550e; cursor:default; font-size:10px; background:#fff6f0; }
  .tag { background:var(--md-sec-container); color:var(--md-on-sec-container); border-radius:999px;
         padding:2px 9px; font-size:11px; margin-right:4px; font-weight:600; }
  .mut { color:var(--mut); }
  .tl { border-top:1px dashed var(--md-outline); margin-top:8px; padding-top:8px; }
  .tl-row { padding:6px 0; border-bottom:1px dashed var(--md-outline-2); font-size:12px; }
  .tl-row:last-child { border-bottom:none; }
  svg text { font-family:inherit; font-size:12px; fill:var(--ink); }
  .noseq { color:var(--mut); font-size:13px; }
  /* GG-W #6：左导航维度 + 右内容两栏（Material Navigation） */
  .layout { display:grid; grid-template-columns:205px 1fr; gap:22px; align-items:start; }
  .sidebar { position:sticky; top:76px; display:flex; flex-direction:column; gap:2px; padding:10px;
             background:var(--md-surf); border-radius:14px; box-shadow:var(--elev-1); align-self:start; }
  .side-title { font-size:12px; color:var(--mut); margin:6px 12px 8px; font-weight:700; letter-spacing:.5px;
                text-transform:uppercase; }
  .dimbtn { border:none; background:none; text-align:left; padding:11px 14px; border-radius:10px;
            font:inherit; font-size:13.5px; font-weight:500; cursor:pointer; color:var(--ink);
            transition:background .12s, color .12s; }
  .dimbtn:hover { background:var(--md-sec-container); color:var(--md-on-sec-container); }
  .dimbtn.on { background:var(--md-pri-container); color:var(--md-pri); font-weight:600; }
  .term { background:#0f1830; color:#c8d6ec; font-family:ui-monospace,Menlo,Consolas,monospace;
          font-size:12px; line-height:1.55; padding:14px; border-radius:12px; max-height:420px;
          overflow:auto; white-space:pre-wrap; user-select:text; -webkit-user-select:text;
          box-shadow:inset 0 0 0 1px rgba(255,255,255,.04), var(--elev-1); }
  .secsub { font-size:15px; font-weight:600; margin:20px 0 10px; }
  .beathead { margin:6px 0; }
  /* 细滚动条（Material 风格） */
  ::-webkit-scrollbar { width:10px; height:10px; }
  ::-webkit-scrollbar-thumb { background:var(--md-outline); border-radius:999px;
                              border:3px solid transparent; background-clip:padding-box; }
  ::-webkit-scrollbar-thumb:hover { background:var(--md-on-surf-var);
                                    border:3px solid transparent; background-clip:padding-box; }
</style>
</head>
<body>
<header>
  <h1>Novel-Data 工作台</h1>
  <select id="novelSel" onchange="loadNovel()"><option value="">（加载中…）</option></select>
</header>
<main class="layout">
  <nav id="dims" class="sidebar" aria-label="维度导航">
    <div class="side-title">维度</div>
    <button class="dimbtn on" data-dim="overview" onclick="showDim('overview')">总览</button>
    <button class="dimbtn" data-dim="summary" onclick="showDim('summary')">进度</button>
    <button class="dimbtn" data-dim="graph" onclick="showDim('graph')">关系图谱</button>
    <button class="dimbtn" data-dim="chars" onclick="showDim('chars')">人物情况</button>
    <button class="dimbtn" data-dim="rhythm" onclick="showDim('rhythm')">章节 · 节拍</button>
    <button class="dimbtn" data-dim="console" onclick="showDim('console')">控制台</button>
    <button class="dimbtn" data-dim="system" onclick="showDim('system')">系统 / 联网</button>
  </nav>
  <div id="pane" class="pane">
  <section id="secOverview" class="dimsec"><h2 style="margin:4px 0 12px">作品进度总览</h2><div id="cards" class="noseq">…</div></section>
  <section id="secSummary" class="dimsec" hidden><h2>进度</h2><div id="summary"></div></section>
  <section id="secGraph" class="dimsec" hidden><h2>关系图谱</h2>
    <div style="margin-bottom:8px">
      <input id="egoCenter" placeholder="心图中心角色 id" style="width:160px">
      <button onclick="loadGraph()">刷新 / 心图</button>
      <button onclick="loadGraph(true)">全书谱</button>
      <span class="mut" style="margin-left:8px">（选中角色后心图一跳）</span>
    </div>
    <div id="graph"></div>
  </section>
  <section id="secChars" class="dimsec" hidden><h2>人物情况</h2>
    <div style="margin-bottom:8px"><span class="mut" id="focusBar">全部角色</span>
      <button onclick="clearFocus()" style="margin-left:8px" title="复位全部人物卡 + 全书谱">全部角色</button>
      <span class="mut" style="margin-left:8px">（点人物卡标题 / 关系图节点聚焦）</span></div>
    <div id="chars"></div></section>
  <section id="secRhythm" class="dimsec" hidden><h2>章节 · 节拍情志条</h2><div id="rhythm"></div></section>
  <section id="secConsole" class="dimsec" hidden><h2>作者控制台</h2>
    <div id="sessionBox" style="border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:6px"></div>
    <h3 class="secsub">设定讨论 / 设定情况 <span class="mut" style="font-size:11px">（确定性快照：阶段 / 简介 / world / 设定方向 / 最近归档讨论）</span></h3>
    <div id="discussionBox"></div>
    <div><h3 class="secsub">定制调整（能力 / 镜头 / 备选稿）</h3><div id="consoleBox"></div></div>
    <details class="termwrap">
      <summary>终端输出（出错时展开详查）<span class="mut" style="font-size:11px">（会话期引擎日志尾部，只读）</span></summary>
      <pre id="termBox" class="term">（未开始作者在环会话，无终端输出）</pre>
    </details>
    <h3 class="secsub">小说正文情况 <span class="mut" style="font-size:11px">（scope 事件 `## 正文` 段；样例小说多为摘要）</span></h3>
    <div id="storyBox"></div>
  </section>
  <section id="secSystem" class="dimsec" hidden><h2>系统设置（/system）</h2><div id="systemBox"></div></section>
  </div>
</main>

<script>
"use strict";
let currentSlug = null;
let focusChar = "";   // 面板 #5 跨卡联动：当前聚焦角色 id（空=全部）
let _sessionDomSig = null;  // §6.3 作者在环：会话 DOM 重绘签名（无变化不重建，保 IME/光标）

async function j(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) throw new Error(path + " -> " + r.status);
  return await r.json();
}
function el(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c =>
  ({ "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c])); }

function card(n) {
  const p = n.outline_pointer || {};
  const beat = n.had_any_beat ? (p.chapter_title || "?") + " · " + (p.beat_intent || "?") : "无大纲";
  return `<div class="card" onclick="pickNovel('${esc(n.slug)}')">
    <h3>${esc(n.title)}</h3>
    <div class="slug">${esc(n.slug)} · ${esc(n.status)}</div>
    <div class="row"><span>当前</span><span>${esc(beat)}</span></div>
    <div class="row"><span>回合</span><span>${p.turns_in_beat ?? "—"}</span></div>
    <div class="row"><span>性格点变化</span><span>${n.growth && n.growth.characters_with_growth || 0}</span></div>
    <div class="row"><span>关系边</span><span>${n.edge_count ?? 0}</span></div>
    <div class="row"><span>事件</span><span>${n.scope_event_count ?? 0}</span></div>
  </div>`;
}

async function loadCards(){
  try {
    const items = await j("/api/novels");
    el("cards").innerHTML = items.map(card).join("");
    const sel = el("novelSel");
    sel.innerHTML = items.map(n => `<option value="${esc(n.slug)}">${esc(n.title)} (${esc(n.slug)})</option>`).join("");
    if (items.length && !currentSlug){ sel.value = items[0].slug; loadNovel(); }
  } catch(e){ el("cards").innerHTML = `<span class="noseq">加载失败：${esc(e.message)}</span>`; }
}

function pickNovel(slug){ el("novelSel").value = slug; loadNovel(); }

/* GG-W #6：左导航维度 + 右内容（懒加载） */
let activeDim = "overview";
const DIMS = ["overview","summary","graph","chars","rhythm","console","system"];
function dimSec(d){ return el(d === "overview" ? "secOverview" : "sec" + d[0].toUpperCase() + d.slice(1)); }

async function runDim(name){
  if (name === "summary"){ if(currentSlug) await loadSummary(); }
  else if (name === "graph"){ if(currentSlug) await loadGraph(); }
  else if (name === "chars"){ if(currentSlug) await loadChars(); }
  else if (name === "rhythm"){ if(currentSlug) await loadRhythm(); }
  else if (name === "console"){ if(currentSlug){ await loadConsole(); await loadStory(); await loadSession(); await loadDiscussion(); } }
  else if (name === "system"){ await loadSystem(); }
}

function showDim(name){
  activeDim = name;
  document.querySelectorAll(".dimbtn").forEach(b => b.classList.toggle("on", b.dataset.dim === name));
  DIMS.forEach(d => { dimSec(d).hidden = (d !== name); });
  if (name !== "console") stopSessionPoll();   // 仅控制台激活才轮询会话
  runDim(name);
}

async function loadNovel(){
  currentSlug = el("novelSel").value;
  if (!currentSlug) return;
  runDim(activeDim);   // 懒加载当前维度
}

async function loadSummary(){
  const n = await j(`/api/novels/${currentSlug}/summary`);
  const p = n.outline_pointer || {};
  // 未开始判定：尚无任何大纲节拍、且无 scope 事件 → 世界/设定尚未建立，先走设定讨论阶段
  const notStarted = !p.had_any_beat && !(n.scope_event_count > 0);
  const hint = notStarted
    ? `<div class="mini" style="border-left:4px solid var(--acc);margin-bottom:14px">
        <h4>尚未开始 · 需进入设定讨论阶段</h4>
        <div class="mut">该小说还没有大纲节拍，世界 / 设定尚未建立。请先在<b>设定讨论阶段</b>完善世界观与设定，确认后才会进入正篇回合。</div>
        <div style="margin-top:10px"><button onclick="showDim('console')">前往控制台 · 设定讨论</button>
          <span class="mut" style="font-size:12px;margin-left:8px">在控制台「开始作者在环」即发起设定讨论</span></div>
      </div>`
    : "";
  el("summary").innerHTML = hint + `
    <div class="mini" style="margin-bottom:14px">
      <h4>书名（在线编辑）</h4>
      <div style="display:flex;gap:8px;align-items:center">
        <input id="titleInput" value="${esc(n.title)}" style="flex:1;min-width:200px">
        <button onclick="renameCurrentNovel()">保存书名</button>
      </div>
      <div class="mut" style="margin-top:4px;font-size:12px">命名即更新 meta/索引/当前指针；若 slug 变化将重命名作品目录并刷新。</div>
    </div>
    <div class="grid">
    <div class="mini"><h4>位置</h4>${esc(p.chapter_title||"—")} · ${esc(p.beat_intent||"—")}<br>
      <span class="mut">回合 ${p.turns_in_beat ?? "—"} / 章 ${esc(p.chapter_id||"—")} 拍 ${esc(p.beat_id||"—")}</span></div>
    <div class="mini"><h4>成长</h4>有状态角色 ${n.growth && n.growth.characters_with_growth||0} · 迁移 ${n.growth && n.growth.transition_entries||0}</div>
    <div class="mini"><h4>关系</h4>${n.edge_count||0} 条边 · ${n.character_count||0} 角色</div>
    <div class="mini"><h4>事件</h4>${n.scope_event_count||0} 条 scope 事件</div>
  </div>`;
}

async function renameCurrentNovel(){
  if (!currentSlug) return;
  const t = (el("titleInput").value || "").trim();
  if (!t){ alert("书名不能为空"); return; }
  try {
    const res = await j(`/api/novels/${currentSlug}/rename`,
      { method:"PATCH", headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ title: t }) });
    currentSlug = res.slug;
    await loadCards();              // 重建总览卡 + 小说下拉（新 slug 加入、旧 slug 移除）
    el("novelSel").value = res.slug;
    runDim("summary");              // 刷新进度页标题/摘要（同一维度）
  } catch(e){ alert("命名失败：" + e.message); }
}

async function loadGraph(whole){
  if (!currentSlug) return;
  const c = el("egoCenter").value.trim();
  let obj;
  if (whole || !c) obj = await j(`/api/novels/${currentSlug}/graph`);
  else obj = await j(`/api/novels/${currentSlug}/graph/ego?center=${encodeURIComponent(c)}&hops=1`);
  renderGraph(obj);
}

function renderGraph(g){
  const nodes = g.nodes || [], edges = g.edges || [];
  if (!nodes.length){ el("graph").innerHTML = `<span class="noseq">暂无关系图谱。</span>`; return; }
  const W = 760, H = 460, R = Math.min(W,H)/2 - 40, cx = W/2, cy = H/2;
  const pos = {};
  nodes.forEach((n,i) => {
    const ang = 2*Math.PI*i/nodes.length - Math.PI/2;
    pos[n.id] = [cx + R*Math.cos(ang), cy + R*Math.sin(ang)];
  });
  let s = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" style="max-width:100%">`;
  edges.forEach(e => {
    const [x1,y1] = pos[e.source_id], [x2,y2] = pos[e.target_id];
    const dash = e.inactive ? ' stroke-dasharray="5 4" opacity="0.55"' : '';
    s += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9aa7b5" stroke-width="${Math.max(1, (e.intensity||1)*1.2)}"${dash}/>`;
  });
  nodes.forEach(n => {
    const [x,y] = pos[n.id];
    s += `<g onclick="focusPerson('${esc(n.id)}')" style="cursor:pointer">
      <circle cx="${x}" cy="${y}" r="18" fill="#fff" stroke="#7d8ea0" stroke-width="1.5"/>
      <text x="${x}" y="${y+4}" text-anchor="middle">${esc(n.name || n.id)}</text></g>`;
  });
  s += "</svg>";
  el("graph").innerHTML = s + `<div style="margin-top:6px"><button onclick="loadPair()">角色对</button>
    <input id="pairA" placeholder="a" style="width:120px"><input id="pairB" placeholder="b" style="width:120px"><div id="pairOut"></div></div>`;
}
function loadEgo(id){ el("egoCenter").value = id; loadGraph(); }
// 面板 #5 跨卡联动：聚焦角色 id —— 高亮人物卡 + 心图跳到该角色
function focusPerson(id){
  if (!id) return;
  focusChar = id;
  el("focusBar").textContent = "聚焦：" + id;
  if (el("egoCenter")){ el("egoCenter").value = id; loadGraph(); }
  markFocus();
}
function clearFocus(){
  focusChar = "";
  el("focusBar").textContent = "全部角色";
  if (el("egoCenter")){ el("egoCenter").value = ""; loadGraph(true); }
  markFocus();
}
// 在已渲染的人物卡上应用 focus/dim 高亮 + 滚入视野（不重新请求，default 不破）
function markFocus(){
  const cards = document.querySelectorAll("#chars .mini");
  let target = null;
  cards.forEach(card => {
    const on = card.getAttribute("data-id") === focusChar;
    card.classList.toggle("focus", on);
    card.classList.toggle("dim", focusChar && !on);
    if (on) target = card;
  });
  if (target && target.scrollIntoView) target.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

async function loadPair(){

function radarSVG(rad){
  const n = 5, cx = 75, cy = 66, R = 46;
  const ring = Array.from({length:n}, (_,k) => (-Math.PI/2 + k*2*Math.PI/n));
  const poly = (lvl, close) => ring.map((a,k) => {
    const r = R*lvl;
    return (k ? "L" : "M") + (cx + r*Math.cos(a)).toFixed(1) + "," + (cy + r*Math.sin(a)).toFixed(1);
  }).join("") + (close ? "Z" : "");
  const grid = [0.33, 0.66, 1].map(l => `<path d="${poly(l,true)}" fill="none" stroke="var(--line)" stroke-width=".6"/>`).join("");
  const axes = ring.map(a => `<line x1="${cx}" y1="${cy}" x2="${(cx+R*Math.cos(a)).toFixed(1)}" y2="${(cy+R*Math.sin(a)).toFixed(1)}" stroke="var(--line)" stroke-width=".5"/>`).join("");
  const labels = ring.map((a,k) => {
    const lx = (cx + (R+14)*Math.cos(a)).toFixed(1), ly = (cy + (R+14)*Math.sin(a)).toFixed(1);
    const r = (rad && rad[k]) || { label:"", level:0 };
    return `<text x="${lx}" y="${ly}" text-anchor="middle" dominant-baseline="middle" font-size="9" fill="var(--ink)">${esc(r.label)}<tspan x="${lx}" dy="10" font-size="8" fill="var(--mut)">${r.level}</tspan></text>`;
  }).join("");
  const data = (rad || []).map((r,k) => { const a=ring[k], rr=R*(r.level||0); return (k?"L":"M") + (cx+rr*Math.cos(a)).toFixed(1) + "," + (cy+rr*Math.sin(a)).toFixed(1); }).join("") + "Z";
  return `<svg width="150" height="132" viewBox="0 0 150 132" style="display:block;margin:4px auto" role="img" aria-label="五维成长雷达">` + grid + axes + labels + `<path d="${data}" fill="rgba(86,124,226,.18)" stroke="var(--acc)" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

// 面板 #3：迁移日志时间线（纯前端渲染 growth.transition_log）。两类条目：
//   成长命中 {rule, turn, scope_id, reason, deltas:[{dim,key,value,note}]}；guard 审计 {rule:"guard.*", turn, scope_id, reason, guard, action, guard_reason}
const _DIM_TL_FULL = {power_state:"能力", mind_state:"心理", social_state:"关系", goal_state:"目标", resource_state:"资源"};
function growthTimeline(tl){
  const log = Array.isArray(tl) ? tl : [];
  if (!log.length) return `<div class="mut" style="margin-top:6px">无迁移记录</div>`;
  const rows = [...log].sort((a,b) => ((a.turn==null?1e9:a.turn) - (b.turn==null?1e9:b.turn)));
  return `<div class="tl">` + rows.map(e => {
    const isGuard = /^guard\./.test(e.rule || "");
    let body;
    if (isGuard){
      const act = e.action === "clamp" ? "钳制" : "跳过";
      body = `<span class="pill warn" title="${esc(e.guard_reason || e.reason || "")}">guard·${esc(act)}</span> ${esc(e.guard||"")}${e.guard_reason ? ` <span class="mut">${esc(e.guard_reason)}</span>` : ""}`;
    } else {
      const d = e.deltas && e.deltas.length ? e.deltas.map(d => {
        if (d && typeof d === "object" && !Array.isArray(d) && d.key !== undefined){
          const lab = _DIM_TL_FULL[d.dim] || d.dim || "";
          const v = d.value===undefined ? "" : " " + (typeof d.value==="number" && d.value>0 ? "+"+d.value : d.value);
          return `<span class="tag">${esc(lab)}·${esc(d.key)}${v}</span>`;
        }
        return "";
      }).join(" ") : "";
      body = `<code style="font-size:10px">${esc(e.rule)}</code> ${d}`;
    }
    const head = `<b style="color:var(--acc)">#${e.turn==null?0:e.turn}</b>${e.scope_id ? ` <span class="mut">${esc(e.scope_id)}</span>` : ""}`;
    return `<div class="tl-row"><div>${head}</div><div>${body}</div><div class="mut" style="font-size:10px;margin-top:2px">${esc((e.reason||"").slice(0,60))}${(e.reason||"").length>60?"…":""}</div></div>`;
  }).join("") + `</div>`;
}

function offSection(os){

/* ---- 作者在环（G4c Session，互斥模式）---- */
let sessionKey = null, sessionTimer = null;

async function loadSession(){
  if (!currentSlug){ return; }
  // 续接同一 uvicorn 进程内已存在的会话（GET 404 = 无会话）
  try {
    const s = await j(`/api/session/${currentSlug}`);
    sessionKey = currentSlug;
    renderSession(s);
  } catch(e){ sessionKey = null; renderSession({ status:"none" }); }
}

function startSessionPoll(){
  if (activeDim !== "console") return;   // GG-W #6：仅控制台维度激活时轮询
  if (sessionTimer) return;
  sessionTimer = setInterval(pollSession, 900);
}
function stopSessionPoll(){
  if (sessionTimer){ clearInterval(sessionTimer); sessionTimer = null; }
}

async function pollSession(){
  if (!sessionKey){ stopSessionPoll(); return; }
  try {
    renderSession(await j(`/api/session/${sessionKey}`));
  } catch(e){ sessionKey = null; stopSessionPoll(); renderSession({ status:"none" }); }
}

function renderSession(s){
  const bar = el("sessionBox");
  if (!s || s.status === "none"){
    stopSessionPoll();
    _sessionDomSig = null;   // 会话结束/清理后复位签名，下次开始重新渲染
    bar.innerHTML = `<div class="mini"><h4>作者在环（互斥）</h4><div>
      <button onclick="startSession()">开始作者在环</button>
      </div><div class="mut" style="margin-top:6px">author_workbench.enabled=true 时终端不读 stdin，作者交互只在前端（G3 / 大纲推进 / 回合审阅 prompt 全走这里）。</div></div>`;
    return;
  }
  const st = s.status;
  // 轮询每 900ms 触发一次。仅当会话「逻辑状态」变化（status/待答 prompt/错误/data_root）才重建
  // sessionBox——否则无条件重建会 recreate replyInput，打断作者正在输入时的 IME 合成与光标，
  // 表现为「输入后无法显示」（D13 §6.3 作者在环收敛；配合 kept 值/选区还原兜底）。
  const sig = JSON.stringify([st, s.data_root, s.pending_prompt || "", s.error || ""]);
  if (sig !== _sessionDomSig){
    _sessionDomSig = sig;
    const prevIn = bar.querySelector("#replyInput");
    const kept = prevIn
      ? { v: prevIn.value, s: prevIn.selectionStart, e: prevIn.selectionEnd,
          f: document.activeElement === prevIn }
      : null;
    let body;
    if (st === "running"){
      body = s.pending_prompt
        ? `<div><b>待作者答复</b></div>
           <div class="mut" style="margin:4px 0;white-space:pre-wrap">${esc(s.pending_prompt)}</div>
           <textarea id="replyInput" rows="2" style="width:100%"></textarea>
           <button onclick="replySession()">提交回复</button>`
        : `<span class="mut">…引擎处理中（非待答）…</span>`;
    } else if (st === "done"){ body = `<span class="mut">已完成本会话。</span>`; }
    else if (st === "failed"){ body = `<span class="noseq">失败：${esc(s.error || "?")}</span>`; }
    else { body = `<span class="mut">已中止（被阻塞的输入已解除，不挂死）。</span>`; }
    bar.innerHTML = `<div class="mini"><h4>作者在环会话 <span class="tag">${esc(st)}</span>
        <span class="slug" style="font-size:11px">data_root: ${esc(s.data_root || "")}</span></h4>
      ${body}
      <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
        ${st === "running" ? `<button onclick="abortSession()">中止</button>` : ""}
        <button onclick="endSession()">结束并清理</button>
      </div></div>`;
    // 重绘后还原用户输入（若新内容仍有 replyInput）
    const ri = bar.querySelector("#replyInput");
    if (ri && kept){
      ri.value = kept.v;
      try { ri.selectionStart = kept.s; ri.selectionEnd = kept.e; } catch(_){}
      if (kept.f && document.activeElement !== ri){ ri.focus(); }
    }
  }
  // GG-W #6：终端输出（会话期日志尾部）随轮询刷新
  const stream = s.stream && Array.isArray(s.stream) ? s.stream : [];
  const term = el("termBox");
  if (term){
    if (!stream.length){
      term.textContent = s.status === "none" ? "（未开始作者在环会话，无终端输出）" : "（引擎处理中，暂无日志…）";
    } else {
      _termEnsureListeners(term);
      // 仅真正变长才改写文本；且用户正在圈选/复制时不打断（否则轮询全量替换会清掉选区）
      const txt = stream.join("\n");
      if (term.textContent !== txt && !_termBusy(term)){
        term.textContent = txt;
        term.scrollTop = term.scrollHeight;   // 钉在最新
      }
    }
  }
  startSessionPoll();
  // §6.9：会话活跃（engine 处理或待答）时随轮询轻刷设定快照（确定性读口，best-effort）
  if (currentSlug && s && (s.status === "running" || s.status === "created")){
    loadDiscussion().catch(()=>{});
  }
}

  const setHtml = settings
    ? `<div class="grid">${settings}</div>`
    : `<div class="mut">尚未生成设定方向（设定讨论会在填简介后产出）。</div>`;

  // 最近归档讨论
  const ds = d.discussion_summary || {};
  const discHtml = ds.summary
    ? `<div class="mut" style="font-size:12px">${esc(ds.summary)}</div>` +
      (ds.last_updated ? `<div class="mut" style="font-size:11px">更新于 ${esc(ds.last_updated)}</div>` : "")
    : `<div class="mut">尚无归档讨论摘要。</div>`;

  el("discussionBox").innerHTML = `
    <div class="row"><span>阶段</span><span>${badge}</span></div>
    ${synEdit}
    ${worldHtml}
    <h4 class="secsub" style="font-size:12px;margin-top:8px">设定方向</h4>${setHtml}
    <h4 class="secsub" style="font-size:12px;margin-top:8px">最近归档讨论</h4>${discHtml}`;
}

// 终端输出可圈选/复制：用户在 termBox 内 mousedown 到 mouseup/复制 期间挂起轮询全量替换，
// 避免上面 renderSession 的 textContent 改写把正在进行的选择清掉。
let _termSecure = false;
function _termBusy(term){
  if (_termSecure) return true;
  const sel = window.getSelection();
  return !!sel && sel.rangeCount > 0 &&
    ((sel.anchorNode && term.contains(sel.anchorNode)) || (sel.focusNode && term.contains(sel.focusNode)));
}
function _termEnsureListeners(term){
  if (term.dataset.copyBuilt) return;
  term.dataset.copyBuilt = "1";
  const release = ()=>{ setTimeout(()=>{ _termSecure = false; }, 250); };
  term.addEventListener("mousedown", ()=>{ _termSecure = true; });
  term.addEventListener("mouseup", release);
  term.addEventListener("selectstart", ()=>{ _termSecure = true; });
  term.addEventListener("copy", ()=>{ _termSecure = false; });
}
async function startSession(){
  const r = await j(`/api/session`, { method:"POST",
    headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ slug: currentSlug, data_root: currentSlug }) });
  sessionKey = r.key;
  renderSession(r);
}
async function replySession(){
  const text = el("replyInput").value;
  const r = await j(`/api/session/${sessionKey}/reply`, { method:"POST",
    headers:{ "Content-Type":"application/json" }, body: JSON.stringify({ text }) });
  renderSession(r);
}
async function abortSession(){
  const r = await j(`/api/session/${sessionKey}/abort`, { method:"POST" })
    .then(x => x).catch(() => ({ status: "gone" }));
  renderSession(r.status === "gone" ? { status:"none" } : r);
}
async function endSession(){
  await j(`/api/session/${sessionKey}`, { method:"DELETE" }).catch(() => {});
  sessionKey = null; stopSessionPoll(); renderSession({ status:"none" });
}

async function loadSystem(){
  const s = await j(`/api/system`);
  const fw = s.framework || {}, wb = s.workbench || {}, net = s.internet_search || {};
  const cn = s.current_novel;
  const prov = net.provider === "playwright" ? "playwright"
    : (net.provider ? esc(net.provider) : "（未设）");
  el("systemBox").innerHTML = `<div class="grid">
    <div class="mini"><h4>当前小说</h4>
      ${cn ? `<b>${esc(cn.slug)}</b><div class="mut">${esc(cn.root)}</div>` : `<span class="noseq">未绑定（config/current_novel.yaml 缺失）</span>`}</div>
    <div class="mini"><h4>LLM（v2 可写 · provider pinned <code>${esc(fw.llm)}</code>）</h4>
      <div class="mut">白名单：${esc((fw.writable || []).join(" / "))} · ${esc(fw.note || "")}</div>
      <label>模型 model<input id="llm_model" value="${esc((fw.options||{}).model||"")}" placeholder="deepseek-v5"></label>
      <label>Base URL<input id="llm_base_url" value="${esc((fw.options||{}).base_url||"")}" placeholder="https://..."></label>
      <label style="width:110px">超时(秒)<input type="number" id="llm_timeout" value="${(fw.options||{}).timeout==null?"":esc((fw.options||{}).timeout)}" min="1" max="300"></label>
      <label style="width:110px">重试次数<input type="number" id="llm_max_retries" value="${(fw.options||{}).max_retries==null?"":esc((fw.options||{}).max_retries)}" min="0" max="10"></label>
      <label>Key 环境变量<input id="llm_api_key_env" value="${esc(fw.api_key_env && fw.api_key_env!=="（未配置）" ? fw.api_key_env : "")}" placeholder="DASHSCOPE_API_KEY"></label>
      <button onclick="patchSystemLLM()" style="margin-top:6px">保存 LLM</button>
      <div class="mut" style="margin-top:4px">仅填需改字段；改后下一会话生效。</div></div>
    <div class="mini"><h4>作者在环互斥</h4>
      <span class="pill${wb.author_workbench_enabled ? " on" : ""}" style="cursor:pointer"
        onclick="patchSystem({'author_workbench_enabled':${wb.author_workbench_enabled ? "false" : "true"}})">
        ${wb.author_workbench_enabled ? "互斥已开（终端静默）" : "终端交互已开"}</span>
      <div class="mut">true 时作者交互只在前端（Session）</div></div>
    <div class="mini"><h4>联网检索</h4>
      <span class="pill${net.enabled ? " on" : ""}" style="cursor:pointer"
        onclick="patchSystem({'internet_search':{'enabled':${net.enabled ? "false" : "true"}}})">
        ${net.enabled ? "联网开" : "联网关"}</span>
      provider <select style="width:100px" onchange="patchSystem({'internet_search':{'provider':this.value}})">
        <option ${net.provider === "playwright" ? "selected" : ""}>playwright</option>
      </select><br>
      max_chars <input type="number" value="${net.max_chars || ""}" min="200" max="8000" step="100" style="width:80px"
        onchange="patchSystem({'internet_search':{'max_chars':Number(this.value)}})" title="200..8000">
      trust <select style="width:100px" onchange="patchSystem({'internet_search':{'trust_level':this.value}})">
        ${["low","medium","high"].map(t => `<option value="${t}" ${net.trust_level === t ? "selected" : ""}>${t}</option>`).join("")}
      </select>
      <div class="mut">timeout ${net.timeout_ms}ms · ${net.max_results} 条 · classifier=${net.require_classifier_signal}</div></div>
  </div>
  ${s.override_source ? `<div class="mut" style="margin-top:8px">override 写入：<code>${esc(s.override_source)}</code></div>` : ""}
  <div class="mut" style="margin-top:4px">${esc(s.effect_note || "")}</div>`;
}
async function patchSystem(payload){
  await j("/api/system", { method:"PATCH", headers:{ "Content-Type":"application/json" }, body: JSON.stringify(payload) });
  await loadSystem();
}
async function patchSystemLLM(){
  const fw = {};
  const m = (el("llm_model").value || "").trim(); if (m) fw.model = m;
  const b = (el("llm_base_url").value || "").trim(); if (b) fw.base_url = b;
  const t = el("llm_timeout").value; if (t !== "") fw.timeout = Number(t);
  const r = el("llm_max_retries").value; if (r !== "") fw.max_retries = Number(r);
  const k = (el("llm_api_key_env").value || "").trim(); if (k) fw.api_key_env = k;
  if (!Object.keys(fw).length){ alert("请先填写要修改的 LLM 字段"); return; }
  await patchSystem({ framework: fw });
}
loadCards();
